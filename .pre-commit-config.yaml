repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.8
  hooks:
    - id: ruff-check
      args: [ --fix ]
    - id: ruff-check
      args: [ --select=I, --fix ]
    - id: ruff-format
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.8.22
  hooks:
    - id: uv-lock
- repo: local
  hooks:
    - id: mojo-format
      name: Format Mojo files
      entry: uv run mojo format
      language: system
      types: [file]
      files: \.mojo$
    - id: mojo-gate-subsumption
      name: Check for unreachable Mojo dispatch gates
      entry: uv run python scripts/check_gate_subsumption.py
      language: system
      types: [file]
      files: \.mojo$
    - id: generated-elementwise
      name: Check generated elementwise registrations
      entry: uv run python scripts/generate_elementwise_ops.py --check
      language: system
      pass_filenames: false
      files: (generate_elementwise_ops\.py|custom_mojo_ops\.py|elementwise_generated\.mojo|pointwise_generated\.mojo)$
