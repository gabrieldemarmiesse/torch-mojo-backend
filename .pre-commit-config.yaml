repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.12.7
  hooks:
    - id: ruff-check
      args: [ --fix ]
    - id: ruff-check
      args: [ --select=I, --fix ]
    - id: ruff-format
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.8.22
  hooks:
    - id: uv-lock
- repo: local
  hooks:
    - id: mojo-format
      name: Format Mojo files
      entry: uv run mojo format
      language: system
      types: [file]
      files: \.mojo$
      # Preserve vendored FA4 source formatting so its recorded upstream hashes
      # remain auditable; backend-owned Mojo files are still formatted normally.
      exclude: ^torch_mojo_backend/eager_flash_attention/
    - id: mojo-gate-subsumption
      name: Check for unreachable Mojo dispatch gates
      entry: uv run python scripts/check_gate_subsumption.py
      language: system
      types: [file]
      files: \.mojo$
