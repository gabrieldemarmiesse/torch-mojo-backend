[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "torch-mojo-backend"
version = "0.3.1"
description = "A PyTorch backend powered by Mojo kernels and Modular's MAX framework"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "mojo==1.0",
    "max==26.5",
    "tabulate",
    "torch>=2.10",
    # NCCL for the mojo-device distributed backend (torch_mojo_backend/distributed).
    # The cu12 build: libnccl.so.2 statically links cudart and dlopens libcuda
    # itself, so it runs on any CUDA-12-capable driver (>= r525) regardless of
    # which CUDA version torch was built for.
    "nvidia-nccl-cu12>=2.27; platform_system == 'Linux'",
    # ptxas for the eager kernels and the MAX graph compiler on NVIDIA. MAX
    # bundles the newest CUDA's ptxas, whose cubins need a driver at least as
    # new (r580 for CUDA 13); the 12.8 wheel's ptxas assembles cubins that
    # every r570+ driver loads. torch_mojo_backend/_ptxas.py points MAX at it
    # unless MODULAR_NVPTX_COMPILER_PATH is already set.
    "nvidia-cuda-nvcc-cu12==12.8.*; platform_system == 'Linux'",
]

[project.urls]
"Source" = "https://github.com/gabrieldemarmiesse/torch-mojo-backend"
"Documentation" = "https://gabrieldemarmiesse.github.io/torch-mojo-backend/"
"Bug Tracker" = "https://github.com/gabrieldemarmiesse/torch-mojo-backend/issues"

[tool.hatch.build.targets.wheel]
packages = ["torch_mojo_backend"]
# The prebuilt native libraries (scripts/build_prebuilt.py) are ignored by
# git, and hatchling skips VCS-ignored files unless they are named here. The
# wheel stays py3-none-any: these are data files ctypes loads at run time, not
# extension modules, and one wheel carrying every platform's pair is simpler
# than a wheel per platform -- a file that does not match the machine is never
# opened (see docs/native_backend.md, "Prebuilt libraries and the wheel").
artifacts = [
    "torch_mojo_backend/native/prebuilt/*.so",
    "torch_mojo_backend/native/prebuilt/*.dylib",
    "torch_mojo_backend/native/prebuilt/manifest.json",
]

[tool.hatch.build.targets.sdist]
# Plain `uv build` builds the wheel from the sdist, so the same list has to be
# here or the libraries silently vanish from the wheel. A checkout without
# prebuilt libraries (every clone) matches nothing and ships as before.
artifacts = [
    "torch_mojo_backend/native/prebuilt/*.so",
    "torch_mojo_backend/native/prebuilt/*.dylib",
    "torch_mojo_backend/native/prebuilt/manifest.json",
]

[tool.ruff]
target-version = "py311"
# Untracked scratch clone of unrelated third-party repos (dicp/dipu), not
# part of this project.
extend-exclude = ["deeplink"]

[tool.ruff.lint]
# extend-select keeps ruff's default rule set (E4, E7, E9, F) enabled.
extend-select = [
    "UP",  # pyupgrade
    "ANN", # flake8-annotations: every function needs type hints (ty then checks them)
    "TID252", # relative imports (banned below)
    "PLC0415", # imports at the top of the file (lazy ones need a noqa saying why)
]

[tool.ruff.lint.isort]
# Keep `from m import (A as A, B as B)` re-exports as one statement.
combine-as-imports = true

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# ty infers unannotated params/returns as Unknown and never flags their misuse,
# so ANN is what actually forces a hint to exist; tests/ predates that (~5k
# gaps, mostly pytest fixture params) and current_bench/ is ad hoc GPU
# profiling scratch, not shipped code -- both excluded, same as in [tool.ty].
"tests/**" = ["ANN"]
"current_bench/**" = ["ANN"]

[tool.ty.environment]
# Pins the venv explicitly: on boxes with an active conda env, ty's
# site-packages discovery prefers CONDA_PREFIX over sys.prefix and fails
# outright ("Failed to discover the site-packages directory") when that
# conda env doesn't look like a normal Python install. `uv run ty check`
# already sidesteps this, but pin it so a bare `ty check` also works.
python = ".venv"

[tool.ty.rules]
# One deliberate polymorphic-override point that nominal override-checking
# cannot express: MojoProcessGroup._get_backend returns itself rather than a
# c10d Backend, because torch looks a group's backend up that way for
# batch_isend_irecv and _coalescing_manager and the mojo group IS its own
# backend (see docs/native_backend.md, "Distributed"). `ty check` exits
# non-zero on warnings too (no `--exit-zero-on-warning` in CI), so this must
# be "ignore", not "warn", to keep `ty check` green.
invalid-method-override = "ignore"
# Bare `dict`/`list`/`Callable` is an unchecked hole: require the arguments.
missing-type-argument = "error"

[tool.ty.src]
exclude = [
    # Untracked scratch clone of unrelated third-party repos (dicp/dipu), not
    # part of this project.
    "deeplink/",
    # Ad hoc GPU profiling/comparison scratch from past kernel-optimization
    # engagements, not shipped code; not held to the same typing bar as
    # benchmarks/ or demo_scripts/.
    "current_bench/",
]

[tool.uv]
python-preference = "only-managed"
override-dependencies = [
    # torch's PyPI wheel pins nvidia-nccl-cu13, which needs an r580+ driver and
    # installs to the same site-packages path (nvidia/nccl/) as the
    # nvidia-nccl-cu12 wheel our distributed backend drives directly. Exclude
    # it; the cu12 wheel satisfies torch's optional libnccl preload too.
    "nvidia-nccl-cu13; sys_platform == 'never'",
]

[tool.ruff.format]
line-ending = "lf"
skip-magic-trailing-comma = true

[dependency-groups]
dev = [
    # Bump the version of mojo/max here.  These come from PyPI like everything
    # else: mojo 1.0 is a stable release, so there is no nightly index and no
    # prerelease opt-in to keep in sync with them.
    "max==26.5.0",
    "max-core==26.5.0",
    "max-mojo-libs==26.5.0",
    "mojo==1.0.0",
    "mblack==26.5.0",
    "mojo-lldb-libs==1.0.0",
    "mojo-compiler==1.0.0",
    "mojo-compiler-mojo-libs==1.0.0",
    "hatchling",
    "ipython",
    # torch ships torch/testing/_internal inside the wheel but not this, its
    # one missing import: without expecttest, common_methods_invocations -- the
    # OpInfo database the conformance/ suite runs -- cannot be imported at all.
    "expecttest>=0.2.1",
    "pillow>=11.3.0",
    "pytest>=8.4.1",
    "pytest-forked>=1.6.0",
    "pytest-split>=0.10.0",
    "pytest-xdist>=3.8.0",
    "requests>=2.32.4",
    "ruff>=0.12.7",
    "tiktoken>=0.11.0",
    "transformers>=4.54.1",
    "coverage>=7.10.6",
    "pytest-cov>=7.0.0",
    "rich>=14.1.0",
    "matplotlib>=3.10.6",
    "pytest-random-order>=1.2.0",
    "setuptools>=80.9.0",
    "pydantic>=2.9",
    "ty>=0.0.77",
]
