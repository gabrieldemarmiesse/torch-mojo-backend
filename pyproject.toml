[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "torch-mojo-backend"
version = "0.2.0"
description = "A PyTorch backend powered by Mojo kernels and Modular's MAX framework"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "max",
    "tabulate",
    "torch>=2.10",
    "beartype>=0.17.0",
]

[project.urls]
"Source" = "https://github.com/gabrieldemarmiesse/torch-mojo-backend"
"Documentation" = "https://gabrieldemarmiesse.github.io/torch-mojo-backend/"
"Bug Tracker" = "https://github.com/gabrieldemarmiesse/torch-mojo-backend/issues"

[tool.hatch.build.targets.wheel]
packages = ["torch_mojo_backend"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "F",  # pyflakes (includes unused imports)
    "UP", # pyupgrade
]


[tool.uv.sources]
max = [
    { index = "modular-nightly" },
]
mblack = [
    { index = "modular-nightly" },
]
max-core = [
    { index = "modular-nightly" },
]
mojo = [
    { index = "modular-nightly" },
]
mojo-lldb-libs = [
    { index = "modular-nightly" },
]
mojo-compiler = [
    { index = "modular-nightly" },
]
max-mojo-libs = [
    { index = "modular-nightly" },
]
max-mojo-mogg-libs = [
    { index = "modular-nightly" },
]
mojo-compiler-mojo-libs = [
    { index = "modular-nightly" },
]

[[tool.uv.index]]
name = "modular-nightly"
url = "https://whl.modular.com/nightly/simple/"
explicit = true

[tool.uv]
prerelease = "explicit"
python-preference = "only-managed"
index-strategy = "unsafe-best-match"

[tool.ruff.format]
skip-magic-trailing-comma = true

[dependency-groups]
dev = [
    # Bump the version of max nightly here
    "max==26.5.0rc1",
    "max-core==26.5.0rc1",
    "max-mojo-libs==26.5.0rc1",
    "mojo==1.0.0rc1",
    "mblack==26.5.0rc1",
    "mojo-lldb-libs==1.0.0rc1",
    "mojo-compiler==1.0.0rc1",
    "mojo-compiler-mojo-libs==1.0.0rc1",
    "hatchling",
    "ipython",
    # torch ships torch/testing/_internal inside the wheel but not this, its
    # one missing import: without expecttest, common_methods_invocations -- the
    # OpInfo database the conformance/ suite runs -- cannot be imported at all.
    "expecttest>=0.2.1",
    "pillow>=11.3.0",
    "pytest>=8.4.1",
    "pytest-forked>=1.6.0",
    "pytest-split>=0.10.0",
    "pytest-xdist>=3.8.0",
    "requests>=2.32.4",
    "ruff>=0.12.7",
    "tiktoken>=0.11.0",
    "transformers>=4.54.1",
    "coverage>=7.10.6",
    "pytest-cov>=7.0.0",
    "rich>=14.1.0",
    "matplotlib>=3.10.6",
    "pytest-random-order>=1.2.0",
    "setuptools>=80.9.0",
    "pydantic>=2.9",
]
